; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps = 
  https://github.com/hansaplasst/dprintf.git

board_build.partitions = partitions.csv     ; Increase the SPIFFS size to 1MB
; board_erase.flash = true                    ; Erase flash if partitions are changed 

build_flags =
  -DBAUDRATE=115200
  -DDEBUG_LEVEL=1 ; Configure DPRINTF debug level here. VERBOSE 0, INFO 1, WARNING 2, ERROR 3

monitor_raw = yes ; Enable raw coloured monitor output, useful for debugging