; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]   ; esp32-s3-devkitc-1-n16r8v <===> esp32-s3-devkitc-1 (N8R8) <===> wemos_d1_mini32
platform = espressif32
board = esp32-s3-devkitc-1 ; esp32-s3-devkitc-1-n16r8v <===> esp32-s3-devkitc-1 (N8R8) <===> wemos_d1_mini32
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyUSB1

lib_deps = 
  Adafruit NeoPixel
  https://github.com/hansaplasst/dprintf.git

board_build.partitions = partitions.csv     ; Increase the SPIFFS size to 1MB
; board_erase.flash = true                    ; Erase flash if partitions are changed 
board_build.arduino.memory_type = qio_opi ; N8R8
board_build.flash_mode = qio              ; N8R8
board_build.psram_type = opi              ; N8R8
board_upload.flash_size = 8MB             ; N8R8
board_upload.maximum_size = 8388608       ; N8R8
board_build.extra_flags = 
  -DBOARD_HAS_PSRAM                       ; N8R8

build_flags =
  -DBAUDRATE=115200
  -DDEBUG_LEVEL=1 ; Configure DPRINTF debug level here. VERBOSE 0, INFO 1, WARNING 2, ERROR 3
  -DLEDPIN=38       ; GPIO pin for LED (change if needed)

monitor_raw = yes ; Enable raw coloured monitor output, useful for debugging